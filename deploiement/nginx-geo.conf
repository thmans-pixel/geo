# YunoHost : à placer dans /etc/nginx/conf.d/geo.izicraft.fr.d/ou-suis-je.conf
# (le domaine geo.izicraft.fr et son certificat sont créés par YunoHost ; ce fichier ne décrit que l'application).
# Le « server { } » est celui de YunoHost : ici seulement les « location ».

location / {
    # Pas de journal d'accès : le lien d'invitation (/?salon=CODE) et /api/salons/CODE contiennent le code du salon.
    access_log off;
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;   # écrase celui du visiteur (sinon les limites de débit se contournent)
    proxy_set_header X-Forwarded-Proto $scheme;
    # secret partagé : l'application n'accepte l'en-tête d'identité que s'il est accompagné de ce secret
    # (remplacer par la même valeur que OUSUISJE_SECRET_PROXY ; ce fichier reste sur le serveur, pas dans le dépôt)
    proxy_set_header X-Auth-Secret "VALEUR_DU_SECRET";
    # L'en-tête d'identité est posé par SSOwat pour un compte connecté.
    # SEUL GARDE-FOU contre un « Remote-User » forgé par un visiteur : le test « en-tête truqué » de deploiement/LISEZMOI.md,
    # à faire AVANT d'ouvrir le site (le secret ci-dessus ne protège que contre un accès direct au port 8000).
    # WebSocket des salons
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 64k;
}

# WebSockets des salons.
location /ws/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;   # écrase celui du visiteur (sinon les limites de débit se contournent)
    proxy_set_header X-Auth-Secret "VALEUR_DU_SECRET";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    access_log off;
}

# À ajouter UNE FOIS dans /etc/nginx/conf.d/ (hors « server ») si $connection_upgrade n'existe pas déjà :
#   map $http_upgrade $connection_upgrade { default upgrade; '' close; }
